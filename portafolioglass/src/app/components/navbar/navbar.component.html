<header class="navbar-wrapper" [class.scrolled]="scrolled()">
  <nav class="navbar-pill glass">
    <!-- Logo -->
    <div class="nav-logo" (click)="scrollTo('hero')">
      <span class="logo-initials">AR</span>
      <span class="logo-dot"></span>
    </div>

    <!-- Desktop Navigation Links -->
    <ul class="nav-links">
      @for (item of navItems; track item.id) {
        <li>
          <button
            class="nav-link-btn"
            [class.active]="activeSection() === item.id"
            (click)="scrollTo(item.id)">
            {{ t(item.labelKey) }}
          </button>
        </li>
      }
    </ul>

    <!-- Controls (Lang & Theme & Mobile Hamburger) -->
    <div class="nav-controls">
      <!-- Language Switcher -->
      <button 
        class="control-glass-btn lang-btn" 
        (click)="translate.toggle()"
        [title]="translate.lang() === 'es' ? 'Cambiar a Inglés' : 'Switch to Spanish'">
        <span>{{ translate.lang() === 'es' ? 'EN' : 'ES' }}</span>
      </button>

      <!-- Theme Switcher -->
      <button 
        class="control-glass-btn theme-btn" 
        (click)="theme.toggle()" 
        [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
        @if (theme.isDark()) {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <!-- Mobile Menu Button -->
      <button 
        class="mobile-toggle-btn" 
        [class.open]="menuOpen()" 
        (click)="menuOpen.update(v => !v)" 
        aria-label="Abrir Menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Dropdown Panel -->
  <div class="mobile-dropdown glass-card" [class.open]="menuOpen()">
    <ul class="mobile-nav-list">
      @for (item of navItems; track item.id) {
        <li>
          <button 
            class="mobile-nav-btn" 
            [class.active]="activeSection() === item.id"
            (click)="scrollTo(item.id)">
            {{ t(item.labelKey) }}
          </button>
        </li>
      }
    </ul>
  </div>
</header>
